server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: buyio-auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_buyio_auth}
    username: ${SPRING_DATASOURCE_USERNAME:buyio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:buyio_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: c3VwZXItc2VjcmV0LWtleS1mb3ItYnV5aW8tcGxhdGZvcm0tYXV0aGVudGljYXRpb24tc2VydmljZS0yMDI2
  expiration-ms: 86400000 # 24 horas

logging:
  level:
    root: INFO
    com.buyio.auth: DEBUG